name: Seed backlog

# Manual only: Actions tab -> "Seed backlog" -> Run workflow.
# Creates the labels, milestones and issues from backlog/*.json in this repo. Safe to rerun.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Seed labels, milestones and issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/seed.py --repo "$GITHUB_REPOSITORY"
